services:
  # ========== БАЗЫ ДАННЫХ ==========

  finance_db:
    image: postgres:15-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=${DB_USER}"
      - "POSTGRES_PASSWORD=${DB_PASS}"
      - "POSTGRES_DB=${DB_NAME}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_MONGO_NAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_MONGO_PASS}
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u ${DB_MONGO_NAME} -p ${DB_MONGO_PASS} --authenticationDatabase admin localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "27017"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== БЭКЕНДЫ ==========

  django_app:
    build:
      context: ./finance
    container_name: api
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    depends_on:
      finance_db:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./finance:/finance
    entrypoint: /finance/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fastapi:
    build:
      context: ./timesheets-app
      dockerfile: Dockerfile
    container_name: fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://${DB_MONGO_NAME}:${DB_MONGO_PASS}@mongodb:27017
      - DEBUG=False
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== ФРОНТЕНД ==========

  vue_app:
    build:
      context: ./finance-app
    container_name: vue-app
    restart: unless-stopped
    depends_on:
      django_app:
        condition: service_started
      fastapi:
        condition: service_started
    networks:
      - app_network
    expose:
      - "80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== STACK ЛОГИРОВАНИЯ ==========

  loki:
    image: grafana/loki:2.9.2
    container_name: finance-loki-1
    restart: unless-stopped
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - app_network
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app_network
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:9.5.14
    container_name: finance-grafana-1
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # ВАЖНО: для работы на подпути /grafana
      - GF_SERVER_ROOT_URL=https://m-zhitkov.ru/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Дополнительные настройки для корректной работы
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_DOMAIN=m-zhitkov.ru
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - app_network
    expose:
      - "3000"
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== NGINX (ОБРАТНЫЙ ПРОКСИ) ==========

  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - URL=m-zhitkov.ru
      - SUBDOMAINS=www,grafana
      - VALIDATION=http
      - EMAIL=m-zhitkov@inbox.ru
      - ONLY_SUBDOMAINS=false
    volumes:
      - ./swag_config:/config
      - ./nginx-conf:/config/nginx/site-confs:rw
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      django_app:
        condition: service_healthy
      vue_app:
        condition: service_started
      fastapi:
        condition: service_started
      grafana:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  loki_data:
  grafana_data: